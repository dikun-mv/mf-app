# Every pnpm command runs here, never on the host:
#   docker compose run --rm tools pnpm install
#   docker compose run --rm tools pnpm lint
#
# The `tools` profile keeps this service out of a plain `docker compose up`.
services:
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/docker/tools.Dockerfile
    working_dir: /repo
    environment:
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    # pnpm keeps its content-addressable store inside the node_modules volume, so
    # installs hard-link instead of copying.
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
      - corepack:/corepack

volumes:
  node_modules:
  corepack:
