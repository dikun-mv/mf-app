# Gateway (ADR 031). Mounted as /etc/nginx/conf.d/default.conf in the stock nginx image.
#
# Two rules shape this file:
#
# 1. The gateway must start, and keep serving everything else, when any one
#    upstream is down. nginx resolves a fixed `proxy_pass` host name once at
#    start and refuses to boot if it fails. So every upstream is held in a
#    variable and resolved per request through Docker's embedded DNS. A
#    stopped container then costs a 502 on its own routes only.
# 2. The gateway never falls back to HTML. SPA fallback lives in each app
#    container's own nginx (app.conf). A missing API route or remote asset
#    is a plain 404 or 502, never an index.html served as JavaScript.

# Docker's embedded DNS. A short validity makes `docker compose stop/start`
# visible within seconds.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    # The gateway listens on 80 inside the container but is published on 8080,
    # so an absolute redirect would point at the wrong port. A relative
    # Location works wherever the gateway is published.
    absolute_redirect off;

    # Keep the client's Host, so redirects built by upstreams stay on
    # localhost:8080. `Connection ""` plus HTTP/1.1 is what SSE needs.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # A down upstream must fail fast. The shell's load timeout (T2.5) is longer.
    proxy_connect_timeout 2s;

    # Used by the compose healthcheck only.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Data services: PocketBase, one instance per team. The prefix is cut ----
    #
    # Same mechanics as the remotes below. The SDK's base URL is /api/people, and its own
    # paths add /api/…, so a request reads /api/people/api/collections/… and reaches
    # PocketBase as /api/collections/….
    #
    # Only what the SDK needs is forwarded, per prefix:
    #   = /api/<p>/api/health                          the health check
    #   = /api/<p>/api/batch                           D9 batches (and every T3.7 write)
    #   /api/<p>/api/collections/<name>/records        list and create, and
    #   /api/<p>/api/collections/<name>/records/<id>   get, update and delete, where <name>
    #                                                  starts with a lowercase letter, so
    #                                                  `_superusers` and the other `_` system
    #                                                  collections are out
    #   = /api/<p>/api/realtime                        below, with its own settings
    # Everything else under /api/<p>/ is the JSON 404 at the end of this block: PocketBase's
    # settings, logs, backups and crons, the schema routes (/api/collections and
    # /api/collections/<name>), the auth routes (/api/collections/<name>/auth-*) and the
    # dashboard under /_/. There is no superuser in this project (plan §1), and this keeps
    # the admin API from being reachable at all.
    #
    # nginx picks an exact match first, then a regex location, then the longest prefix, so the
    # two prefix locations at the end only see what the others did not take. A regex location
    # matches the decoded path, which only chooses the route: `rewrite ... break` cuts the
    # prefix and nginx escapes the path again, so `a%20b` reaches PocketBase still encoded and
    # the query string is carried over untouched (see the remotes comment). A record id is one
    # path segment: `a%2Fb` decodes to two and is a 404.

    location = /api/people/api/health {
        set $people_pb http://people-pb:8090;
        rewrite ^/api/people(/.*)$ $1 break;
        proxy_pass $people_pb;
    }

    location = /api/people/api/batch {
        set $people_pb http://people-pb:8090;
        rewrite ^/api/people(/.*)$ $1 break;
        proxy_pass $people_pb;
    }

    location ~ ^/api/people/api/collections/[a-z][A-Za-z0-9_]*/records(/[^/]+)?$ {
        set $people_pb http://people-pb:8090;
        rewrite ^/api/people(/.*)$ $1 break;
        proxy_pass $people_pb;
    }

    location = /api/delivery/api/health {
        set $delivery_pb http://delivery-pb:8090;
        rewrite ^/api/delivery(/.*)$ $1 break;
        proxy_pass $delivery_pb;
    }

    location = /api/delivery/api/batch {
        set $delivery_pb http://delivery-pb:8090;
        rewrite ^/api/delivery(/.*)$ $1 break;
        proxy_pass $delivery_pb;
    }

    location ~ ^/api/delivery/api/collections/[a-z][A-Za-z0-9_]*/records(/[^/]+)?$ {
        set $delivery_pb http://delivery-pb:8090;
        rewrite ^/api/delivery(/.*)$ $1 break;
        proxy_pass $delivery_pb;
    }

    # `types {}` switches off the file-extension lookup: without it a path ending in .html
    # or .png would be sent as text/html or image/png, and default_type would not apply.
    location /api/people/ {
        types {}
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"No such API route"}}';
    }

    location /api/delivery/ {
        types {}
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"No such API route"}}';
    }

    # Realtime is Server-Sent Events: a long-lived response that must reach the client
    # as it is written. No buffering or caching, and timeouts long enough that an idle
    # stream isn't cut (PocketBase sends a keep-alive, and the SDK reconnects anyway).
    # Exact matches, so they win over the locations above.

    location = /api/people/api/realtime {
        set $people_pb http://people-pb:8090;
        rewrite ^/api/people(/.*)$ $1 break;
        proxy_pass $people_pb;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /api/delivery/api/realtime {
        set $delivery_pb http://delivery-pb:8090;
        rewrite ^/api/delivery(/.*)$ $1 break;
        proxy_pass $delivery_pb;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Any other /api/ path is a JSON 404, never the shell's HTML.
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"No such API route"}}';
    }

    # ---- Remotes: the /remotes/<name>/ prefix is stripped ----
    #
    # With a variable in proxy_pass, nginx does not strip the location prefix
    # by itself, so `rewrite ... break` cuts it. The rewritten URI is escaped
    # again on the way out and the query string is carried over untouched.
    # (Building the target from a regex capture instead would send the decoded
    # path: `a%20b` would reach the remote as `a b`, and `x%3Fy=1` would be
    # split into a path and a query.)

    location = /remotes/people {
        return 301 /remotes/people/$is_args$args;
    }

    location /remotes/people/ {
        set $people_remote http://people:80;
        rewrite ^/remotes/people(/.*)$ $1 break;
        proxy_pass $people_remote;
    }

    location = /remotes/delivery {
        return 301 /remotes/delivery/$is_args$args;
    }

    location /remotes/delivery/ {
        set $delivery_remote http://delivery:80;
        rewrite ^/remotes/delivery(/.*)$ $1 break;
        proxy_pass $delivery_remote;
    }

    # Unknown remote name.
    location /remotes/ {
        return 404;
    }

    # ---- Shell: everything else, including /config.json, /people/*, /delivery/* ----

    location / {
        set $shell http://shell:80;
        proxy_pass $shell;
    }
}
