# Gateway (ADR 031). Mounted as /etc/nginx/conf.d/default.conf in the stock nginx image.
#
# Two rules shape this file:
#
# 1. The gateway must start, and keep serving everything else, when any one
#    upstream is down. nginx resolves a fixed `proxy_pass` host name once at
#    start and refuses to boot if it fails. So every upstream is held in a
#    variable and resolved per request through Docker's embedded DNS. A
#    stopped container then costs a 502 on its own routes only.
# 2. The gateway never falls back to HTML. SPA fallback lives in each app
#    container's own nginx (app.conf). A missing API route or remote asset
#    is a plain 404 or 502, never an index.html served as JavaScript.

# Docker's embedded DNS. A short validity makes `docker compose stop/start`
# visible within seconds.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    # Keep the client's Host, so redirects built by upstreams stay on
    # localhost:8080. `Connection ""` plus HTTP/1.1 is what SSE needs.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # A down upstream must fail fast. The shell's load timeout (T2.5) is longer.
    proxy_connect_timeout 2s;

    # Used by the compose healthcheck only.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No data service is routed yet (Phase 3). Anything under /api/ is a JSON
    # 404, never the shell's HTML.
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"No such API route"}}';
    }

    # ---- Remotes: the /remotes/<name>/ prefix is stripped ----
    #
    # With a variable in proxy_pass, nginx sends the URI exactly as written, so
    # the prefix is cut by capturing the rest of the path, and the query string
    # is added back by hand.

    location = /remotes/people {
        return 301 /remotes/people/;
    }

    location ~ ^/remotes/people/(?<people_rest>.*)$ {
        set $people_remote http://people:80;
        proxy_pass $people_remote/$people_rest$is_args$args;
    }

    location = /remotes/delivery {
        return 301 /remotes/delivery/;
    }

    location ~ ^/remotes/delivery/(?<delivery_rest>.*)$ {
        set $delivery_remote http://delivery:80;
        proxy_pass $delivery_remote/$delivery_rest$is_args$args;
    }

    # Unknown remote name.
    location /remotes/ {
        return 404;
    }

    # ---- Shell: everything else, including /config.json, /people/*, /delivery/* ----

    location / {
        set $shell http://shell:80;
        proxy_pass $shell;
    }
}
