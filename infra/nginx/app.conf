# Static app container (shell, people, delivery; ADR 031). Installed as
# /etc/nginx/conf.d/default.conf in each app image; serves its build output
# at "/".
#
# Page routes fall back to index.html (deep links and reloads, D22). Anything
# that looks like a file (has an extension) never does: a missing
# remoteEntry.js, chunk, source map or config.json must be a 404, not an HTML
# page that the module loader would fail to parse.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects must not expose the container's host name: the browser only
    # knows the gateway.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Entry points whose content changes between deploys while their URL does
    # not. Revalidate every time (ETag makes that cheap).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /remoteEntry.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # A last path segment with an extension is a file request. Files are
    # content-hashed by the build, so default caching headers are enough.
    location ~ /[^/]+\.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Everything else is a page route of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
